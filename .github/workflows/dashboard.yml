name: dashboard

on:
  schedule:
    # GitHub запускает cron с опозданием (бывало на 5–7 часов), поэтому сборок несколько в день:
    # 06:17, 10:17, 14:17, 18:17, 22:17 МСК. Сразу — кнопкой «Обновить» на дашборде (workflow_dispatch).
    - cron: '17 3,7,11,15,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Собрать данные
        env:
          GETCOURSE_ACCOUNT: artemzuev
          METRIKA_COUNTER_ADS: '113735882'
          METRIKA_COUNTER_ORGANIC: '113735885'
          GETCOURSE_KEY: ${{ secrets.GETCOURSE_KEY }}
          BIZON_TOKEN: ${{ secrets.BIZON_TOKEN }}
          METRIKA_TOKEN: ${{ secrets.METRIKA_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          EXCLUDE_EMAILS: ${{ secrets.EXCLUDE_EMAILS }}
          DASHBOARD_TRIGGER_TOKEN: ${{ secrets.DASHBOARD_TRIGGER_TOKEN }}
        run: python update_dashboard.py
      - name: Опубликовать зашифрованные данные
        run: |
          git config user.name 'dashboard-bot'
          git config user.email 'dashboard-bot@users.noreply.github.com'
          git add docs/data.enc docs/index.html
          git diff --cached --quiet && echo 'без изменений' || (git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC" && git pull --rebase -X theirs origin main && git push)
